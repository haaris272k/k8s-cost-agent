[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k8s-cost-agent"
version = "2.0.0"
description = "Explainable, guardrail-first Kubernetes resource right-sizing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0.0",
  "kubernetes==29.0.0",
  "prometheus-api-client==0.5.5",
  "python-dotenv==1.0.1",
]

[project.scripts]
k8s-cost-agent = "k8s_cost_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
